name: CI Testing & Code Quality

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Run Black Code Format Check
        run: |
          black --check apps/agent

      - name: Run Flake8 Linting
        run: |
          flake8 apps/agent --count --max-line-length=120 --ignore=E501,W503 --statistics

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install Frontend Dependencies & Lint
        run: |
          cd apps/web
          npm ci
          npm run lint || true

  test:
    name: Pytest & LangSmith Evaluation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/agent/requirements.txt
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite with LangSmith Evaluation
        env:
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest apps/agent/tests -v
