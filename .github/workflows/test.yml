name: CI Testing & Code Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Python checks on changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black==26.10.1 flake8==7.4.1
      # Incremental formatting avoids rewriting unrelated legacy voice modules.
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'apps/agent/*.py' 'apps/agent/**/*.py' 'connect_gmail.py')
          if [ ${#files[@]} -gt 0 ]; then
            black --check "${files[@]}"
            flake8 "${files[@]}" --max-line-length=120 --ignore=E501,W503,E203,E402 --statistics
          fi

  test:
    name: Offline backend regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r apps/agent/requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Execute tests without external reporting plugins
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: apps/agent
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
        run: pytest -p pytest_asyncio.plugin apps/agent/tests -v

  web:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:voice
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
